# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build and publish Galette Docker image

on:
  release:
    types: [published]

jobs:
  resolve:
    name: Resolve version and tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Resolve version and tags
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$RELEASE_TAG"
          ref="$version"
          tags=()
          for image in galette/galette ghcr.io/galette/galette; do
            tags+=("${image}:${version}" "${image}:latest")
          done
          {
            echo "version=${version}"
            echo "ref=${ref}"
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: resolve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.version }}
      tags: ${{ needs.resolve.outputs.tags }}
      build-args: |
        GALETTE_VERSION=${{ needs.resolve.outputs.version }}
      update-description: true
    secrets: inherit
