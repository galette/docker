# Builds the image and pushes it.
# Called by docker-build-and-publish.yml; it is not meant to be run on its own.

name: Build image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of this repository to build the Dockerfile from
        required: true
        type: string
      version:
        description: Value of the org.opencontainers.image.version label
        required: true
        type: string
      tags:
        description: Image tags to push, one per line, with the registry
        required: true
        type: string
      build-args:
        description: Docker build arguments, one per line
        required: false
        type: string
        default: ''
      update-description:
        description: Push README.md as the Docker Hub description
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          echo "Tags to push:"
          echo "$TAGS"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ inputs.build-args }}

      - name: Docker Hub Description
        if: inputs.update-description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: galette/galette
          readme-filepath: ./README.md
          short-description: Membership management web application towards non profit organizations
          enable-url-completion: true
