# Builds the image, pushes it to Docker Hub and GHCR, attests it and scans it.
# Called by docker-build-and-publish.yml; it is not meant to be run on its own.

name: Build image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of this repository to build the Dockerfile from
        required: true
        type: string
      version:
        description: Value of the org.opencontainers.image.version label
        required: true
        type: string
      tags:
        description: Image tags to push, one per line, with the registry
        required: true
        type: string
      build-args:
        description: Docker build arguments, one per line
        required: false
        type: string
        default: ''
      scan-category:
        description: Code scanning category, so stable and nightly results do not replace each other
        required: true
        type: string
      update-description:
        description: Push README.md as the Docker Hub description
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build, push and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          echo "Tags to push:"
          echo "$TAGS"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ inputs.build-args }}

      # Verify with `gh attestation verify oci://ghcr.io/galette/galette:<tag> --repo galette/docker`
      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/galette/galette
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/galette/galette
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The image itself, not the tag, which may already have moved. Trivy runs
      # from its own image rather than a third-party action. Never fatal: the
      # point is to make the findings visible in the Security tab.
      - name: Scan the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.0 image \
            --quiet --scanners vuln --platform linux/amd64 \
            --format sarif --output /out/trivy.sarif \
            "ghcr.io/galette/galette@${DIGEST}" \
          || echo "::warning::the vulnerability scan failed, see above"

      - name: Upload scan results
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: ${{ inputs.scan-category }}

      - name: Docker Hub Description
        if: inputs.update-description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: galette/galette
          readme-filepath: ./README.md
          short-description: Membership management web application towards non profit organizations
          enable-url-completion: true
